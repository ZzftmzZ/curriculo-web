# render.yaml — Blueprint (IaC) | Currículo Web
# Ref: https://render.com/docs/blueprint-spec | OWASP Secure Headers | LGPD (Lei 13.709/2018)
services:
  - type: web
    name: curriculo-web
    runtime: static
    repo: https://github.com/ZzftmzZ/curriculo-web
    branch: main
    buildCommand: echo "static"
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    autoDeploy: true
    # sem rewrite /* -> index.html: quebraria o 404.html (site não é SPA)
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'none';
          script-src 'self' 'unsafe-inline';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src https://fonts.gstatic.com;
          img-src 'self' data:;
          connect-src 'self';
          manifest-src 'self';
          base-uri 'none';
          form-action 'none';
          frame-ancestors 'none'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      - path: /*.html
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
      # style.css sem hash no nome -> NÃO usar immutable
      - path: /style.css
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      - path: /curriculo.pdf
        name: Cache-Control
        value: public, max-age=86400, must-revalidate
